<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>球団一覧</title>
</head>
<body>

<h1>球団一覧</h1>

<table border="1">

    <tr>
        <th>球団名</th>
        <th>発足日</th>
    </tr>

    <tr th:each="team : ${teamList}">
        <td>
            <a th:href="@{/teams/{id}(id=${team.id})}"
               th:text="${team.teamName}">
            </a>
        </td>

        <td th:text="${team.foundingDate}"></td>
    </tr>

</table>

</body>
</html>
