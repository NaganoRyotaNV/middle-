<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>掲示板</title>
<style>
    .article-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .article-actions form {
        margin: 0;
    }

    .like-count {
        font-weight: bold;
    }
</style>
</head>
<body>

<form th:action="@{/board/articles}" method="post">
    <div>
        <label>
            投稿者名：
            <input type="text" name="name">
        </label>
    </div>

    <div>
        <label>
            投稿内容：
            <textarea name="content" rows="5" cols="40"></textarea>
        </label>
    </div>

    <button type="submit">記事投稿</button>
</form>

<hr>

<div th:each="article : ${articleList}">
    <p>
        投稿者名：
        <span th:text="${article.name}"></span>
    </p>

    <p>投稿内容：</p>
    <p>
        <strong th:text="${article.content}"></strong>
    </p>

    <div class="article-actions">
        <form th:action="@{/board/articles/delete}" method="post">
            <input type="hidden" name="articleId" th:value="${article.id}">
            <button type="submit">記事削除</button>
        </form>
        <button class="like-button" type="button"
                th:data-article-id="${article.id}"
                th:data-url="@{/board/articles/like}">いいね</button>
        <span class="like-count" th:data-article-id="${article.id}">0</span>
    </div>

    <br>

    <div th:each="comment : ${article.commentList}">
        <p>
            コメント者名：
            <span th:text="${comment.name}"></span>
        </p>

        <p>コメント内容：</p>
        <p>
            <strong th:text="${comment.content}"></strong>
        </p>
    </div>

    <form th:action="@{/board/comments}" method="post">
        <input type="hidden" name="articleId" th:value="${article.id}">

        <div>
            <label>
                名前:
                <br>
                <input type="text" name="name">
            </label>
        </div>

        <div>
            <label>
                コメント:
                <br>
                <textarea name="content" rows="6" cols="45"></textarea>
            </label>
        </div>

        <button type="submit">コメント投稿</button>
    </form>

    <hr>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/board-like.js}"></script>
</body>
</html>
