<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajax 課題</title>
<link rel="stylesheet" th:href="@{/css/ajax-exercises.css}">
</head>
<body>

<main class="page">
    <h1>JavaScript / jQuery / Ajax 課題</h1>

    <section class="exercise">
        <h2>課題1：郵便番号から住所を取得する</h2>
        <div class="form-row">
            <label for="zipcode">郵便番号（ハイフンは含めない）：</label>
            <input id="zipcode" type="text" maxlength="7" value="2208111">
            <button id="get_address_btn" type="button">住所取得</button>
        </div>

        <p class="section-label">住所：</p>
        <div class="address-grid">
            <select id="prefecture" aria-label="都道府県">
                <option value="">都道府県を選択</option>
                <option>北海道</option>
                <option>青森県</option>
                <option>岩手県</option>
                <option>宮城県</option>
                <option>秋田県</option>
                <option>山形県</option>
                <option>福島県</option>
                <option>茨城県</option>
                <option>栃木県</option>
                <option>群馬県</option>
                <option>埼玉県</option>
                <option>千葉県</option>
                <option>東京都</option>
                <option>神奈川県</option>
                <option>新潟県</option>
                <option>富山県</option>
                <option>石川県</option>
                <option>福井県</option>
                <option>山梨県</option>
                <option>長野県</option>
                <option>岐阜県</option>
                <option>静岡県</option>
                <option>愛知県</option>
                <option>三重県</option>
                <option>滋賀県</option>
                <option>京都府</option>
                <option>大阪府</option>
                <option>兵庫県</option>
                <option>奈良県</option>
                <option>和歌山県</option>
                <option>鳥取県</option>
                <option>島根県</option>
                <option>岡山県</option>
                <option>広島県</option>
                <option>山口県</option>
                <option>徳島県</option>
                <option>香川県</option>
                <option>愛媛県</option>
                <option>高知県</option>
                <option>福岡県</option>
                <option>佐賀県</option>
                <option>長崎県</option>
                <option>熊本県</option>
                <option>大分県</option>
                <option>宮崎県</option>
                <option>鹿児島県</option>
                <option>沖縄県</option>
            </select>
            <input id="city" type="text" placeholder="市区町村">
            <input id="street" type="text" placeholder="それ以降の住所">
        </div>
    </section>

    <section class="exercise">
        <h2>課題2：パスワードチェックを非同期で行う</h2>
        <p id="robustness_message" class="message">パスワードは8文字以上で入力してください</p>
        <label class="field">
            Password:
            <input id="password" type="password" autocomplete="new-password">
        </label>
        <p id="disagreement_message" class="message">パスワードが一致していません</p>
        <label class="field">
            Confirmation Password:
            <input id="confirmation_password" type="password" autocomplete="new-password">
        </label>
    </section>

    <section class="exercise">
        <h2>課題3：ステータスを非同期で変更する</h2>
        <p class="section-label">現在のステータス：</p>
        <p id="status_text" class="status-text">入金前</p>
        <button id="update_status_btn" type="button">入金済へ変更</button>
    </section>

    <section class="exercise">
        <h2>課題4：従業員一覧取得</h2>
        <button id="get_employees_btn" type="button">従業員一覧取得</button>
        <p id="employee_count" class="message"></p>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>画像</th>
                        <th>名前</th>
                        <th>入社日</th>
                    </tr>
                </thead>
                <tbody id="employee_table_body"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/ajax-exercises.js}"></script>
</body>
</html>
