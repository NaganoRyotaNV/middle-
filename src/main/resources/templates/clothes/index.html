<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>衣類検索</title>
</head>
<body>

<h1>衣類検索</h1>

<form th:action="@{/clothes/search}" method="get">

    <label>
        <input type="radio" name="gender" value="Man" checked>
        Man
    </label>

    <br>

    <label>
        <input type="radio" name="gender" value="Woman">
        Woman
    </label>

    <br>

    <select name="color">
        <option value="赤">赤</option>
        <option value="青">青</option>
        <option value="白">白</option>
        <option value="黄">黄</option>
    </select>

    <br>

    <button type="submit">検索</button>
</form>

<p th:if="${message}" th:text="${message}"></p>

<table border="1" th:if="${clothesList}">
    <tr>
        <th>ジャンル</th>
        <th>サイズ</th>
        <th>価格</th>
    </tr>

    <tr th:each="clothes : ${clothesList}">
        <td th:text="${clothes.genre}"></td>
        <td th:text="${clothes.size}"></td>
        <td th:text="${clothes.price}"></td>
    </tr>
</table>

</body>
</html>
